<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Little Writer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ff6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little Writer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
:root{
  --bg:#fdf6e3; --paper:#fffdf6; --card:#ffffff; --ink:#2a2146; --muted:#6f6690;
  --coral:#ff6b4a; --sun:#ffc23d; --leaf:#2bb673; --sky:#3b8df0; --grape:#8a5cf0;
  --road:#ece4d2; --road-edge:#dccfb3; --line-red:#ef8f86; --line-blue:#93b8f2;
  --shadow:0 4px 0 rgba(42,33,70,.14);
  --display:"Andika",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Andika","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1631; --paper:#221d3d; --card:#2b2550; --ink:#f4f0ff; --muted:#b3a9d6;
    --road:#39315f; --road-edge:#4a4178; --line-red:#b8645e; --line-blue:#5f82bf;
    --shadow:0 4px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1631; --paper:#221d3d; --card:#2b2550; --ink:#f4f0ff; --muted:#b3a9d6;
  --road:#39315f; --road-edge:#4a4178; --line-red:#b8645e; --line-blue:#5f82bf;
  --shadow:0 4px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;
  overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.bar{display:flex;align-items:center;gap:10px;min-height:56px}
.bar .grow{flex:1}
.round{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:28px;flex:none}
.round:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 16px;
  font-family:var(--display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:6px}

/* home */
.hello{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,48px);line-height:1;margin:6px 0 14px;text-wrap:balance}
.hello span{color:var(--coral)}
.sub{color:var(--muted);margin:0 0 14px}
.menu{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start;overflow-y:auto;padding-bottom:8px}
.tile{border-radius:28px;padding:14px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;
  text-align:left;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.tile small{font-size:15px;opacity:.9}
.tile .art{height:58px;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden}
.tile .art svg{height:100%;width:auto}
.tile.wide{grid-column:span 2;min-height:110px}
.t-lines{background:var(--grape)} .t-num{background:var(--sky)} .t-let{background:var(--coral)}
.t-count{background:var(--leaf)} .t-abc{background:#e2861b} .t-pop{background:#e0457b} .t-stick{background:#5b4b8a}
.gear{opacity:.5;font-size:22px;width:44px;height:44px}

/* grid of items */
.items{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;align-content:start;padding:8px 2px}
.item{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.item svg{width:64px;height:76px}
.item.next{animation:bob 1.4s ease-in-out infinite}
.stars{font-size:16px;letter-spacing:1px}
.stars .off{opacity:.25;filter:grayscale(1)}
@keyframes bob{50%{transform:translateY(-6px)}}
.wtitle{font-family:var(--display);font-weight:700;font-size:28px}

/* trace */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:44px;margin:6px 0}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--card);
  box-shadow:var(--shadow);font-weight:700;font-size:15px;opacity:.5;transition:opacity .2s,transform .2s}
.chip svg{width:24px;height:24px}
.chip.on{opacity:1;transform:scale(1.08);outline:3px solid var(--sun)}
.chip.done{opacity:.9}
.stage{flex:1;position:relative;border-radius:28px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.stagebtns{display:flex;justify-content:center;gap:14px;padding-top:12px}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(26,22,49,.55);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--card);border-radius:32px;padding:22px 18px;width:min(420px,100%);text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);
  animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.card .big{font-family:var(--display);font-weight:700;font-size:64px;line-height:1.1}
.card .word{font-size:34px;font-weight:700}
.card .word em{font-style:normal;color:var(--coral)}
.card .pics{font-size:44px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:56px;margin:10px 0}
.card .pics span{animation:popin .3s both}
.card .row{display:flex;justify-content:center;gap:14px;margin-top:16px}
.card .bigstars{font-size:40px}
.card .glyphbox{height:100px;display:flex;justify-content:center}
.card .newsticker{margin-top:10px;font-weight:700;color:var(--grape)}

/* counting */
.countbox{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px;padding:10px;border-radius:28px;background:var(--paper);box-shadow:var(--shadow)}
.thing{font-size:clamp(44px,13vw,64px);width:1.35em;height:1.35em;display:grid;place-items:center;border-radius:50%;position:relative;transition:transform .15s}
.thing.counted{background:color-mix(in srgb,var(--sun) 35%,transparent);transform:scale(.92)}
.thing .n{position:absolute;right:-2px;top:-4px;font:700 18px var(--display);background:var(--coral);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.answers{display:flex;gap:12px;justify-content:center;padding-top:14px;flex-wrap:wrap}
.ans{width:72px;height:72px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.ans svg{width:44px;height:52px}
.ans.wrong{animation:shake .4s}
.ans.right{background:var(--leaf)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.prompt{text-align:center;font-family:var(--display);font-weight:700;font-size:26px;min-height:40px;margin:4px 0}

/* picture match */
.bigletter{display:grid;place-items:center;flex:0 0 auto;height:30vh}
.bigletter svg{height:100%;width:auto}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:10px}
.pick{background:var(--card);border-radius:24px;box-shadow:var(--shadow);font-size:clamp(48px,14vw,72px);padding:12px 0;display:flex;flex-direction:column;align-items:center}
.pick small{font-size:16px;font-weight:700}
.pick.wrong{animation:shake .4s}
.pick.right{background:color-mix(in srgb,var(--leaf) 40%,var(--card))}

/* balloons */
.sky{flex:1;position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(#8fd3ff,#d9f2ff);box-shadow:var(--shadow)}
.balloon{position:absolute;width:92px;height:112px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;
  box-shadow:inset -10px -12px 0 rgba(0,0,0,.12);touch-action:manipulation}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:rgba(0,0,0,.25)}
.balloon svg{width:52px;height:62px}
.balloon.pop{animation:pop .3s forwards;pointer-events:none}
.balloon.wrong{animation:wobble .4s}
@keyframes pop{to{scale:1.6;opacity:0}}
@keyframes wobble{25%{rotate:-12deg}75%{rotate:12deg}}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--road-edge)}
.dots i.on{background:var(--leaf)}

/* stickers */
.book{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px;align-content:start;padding:8px 2px}
.slot{aspect-ratio:1;max-width:100%;border-radius:22px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:44px}
.slot.locked{font-size:26px;color:var(--muted);background:color-mix(in srgb,var(--card) 60%,transparent)}
.meter{height:16px;border-radius:999px;background:var(--road);overflow:hidden;margin:6px 0 10px}
.meter i{display:block;height:100%;background:var(--sun)}

/* parent panel */
.parent label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;text-align:left;font-size:17px}
.parent input[type=text]{font:inherit;padding:8px 10px;border-radius:12px;border:2px solid var(--road-edge);background:var(--paper);color:var(--ink);width:55%}
.parent input[type=checkbox]{width:26px;height:26px;accent-color:var(--leaf)}
.textbtn{padding:12px 18px;border-radius:16px;background:var(--road);font-weight:700}
.textbtn.danger{color:#c0392b}
/* pictures + new games */
img.pic{width:1em;height:1em;object-fit:contain;vertical-align:middle;-webkit-user-drag:none;pointer-events:none}
.tile .art{font-size:40px;padding-top:4px}
.tile .op{font:700 44px var(--display);letter-spacing:2px}
.t-add{background:#0e9f9a} .t-sub{background:#c2527a}
.round img.pic{font-size:34px}
.thing img.pic,.pick img.pic{font-size:1em}
.card .pics img.pic{font-size:52px}
.eq{display:flex;align-items:center;justify-content:center;gap:6px;min-height:78px;font:700 44px var(--display);margin:4px 0}
.eq svg{height:64px;width:auto}
.eq .q{width:52px;height:64px;border-radius:14px;border:3px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font-size:36px}
.mathbox{gap:6px;align-content:center}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:46%;padding:8px;border-radius:22px;background:color-mix(in srgb,var(--sky) 10%,transparent)}
.mathbox .sign{align-self:center;font:700 48px var(--display);color:var(--muted)}
.mathbox .thing{font-size:clamp(38px,11vw,56px)}
.thing.flyaway{animation:flyaway 1s forwards;pointer-events:none}
@keyframes flyaway{to{translate:0 -160px;opacity:0;rotate:20deg}}
.phrases{max-height:55vh;overflow-y:auto;text-align:left;margin-top:10px;display:grid;gap:4px}
.phrases button{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--road);text-align:left;font-size:15px}
/* auto-continue ring on the play button */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.round.go{background:var(--leaf);position:relative}
.round.go.counting::before{content:"";position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(var(--sun) calc(var(--p)*1%),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  animation:fillring var(--wait,4s) linear forwards}
@keyframes fillring{to{--p:100}}
.parent select{font:inherit;padding:6px 10px;border-radius:12px;border:2px solid var(--road-edge);background:var(--paper);color:var(--ink)}
/* tip for grown-ups: sideways fits more copies in a row */
.turnhint{position:absolute;left:50%;bottom:10px;translate:-50% 0;padding:6px 12px;border-radius:999px;background:var(--road);color:var(--muted);
  font-size:14px;white-space:nowrap;pointer-events:none;animation:hintfade 7s forwards}
@keyframes hintfade{0%,80%{opacity:1}100%{opacity:0}}
@media (orientation:landscape){.turnhint{display:none}}
/* phone held sideways: buttons down the left, building blocks down the right, the row of copies in the middle */
@media (orientation:landscape) and (max-height:540px){
  #trace{flex-direction:row;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  #trace .bar{flex-direction:column;justify-content:flex-start;min-height:0;width:48px;gap:8px}
  #trace .bar .grow{flex:0}
  #trace .bar .round{width:46px;height:46px;font-size:22px}
  #trace .bar .round img.pic{font-size:28px}
  #trace #tStars{flex-direction:column;padding:6px 4px;font-size:13px;gap:0}
  #trace .stage{order:2}
  #trace .chips{order:3;flex-direction:column;flex-wrap:nowrap;justify-content:center;margin:0;min-height:0;gap:8px}
  #trace .chip{padding:6px}
  #trace .chip .cname{display:none}
  .card{max-height:calc(100vh - 24px);overflow-y:auto;padding:14px}
  .card .big{font-size:44px}
  .card .bigstars{font-size:26px}
  .card .glyphbox{height:60px}
  .card .pics{margin:4px 0;min-height:40px}
  .card .pics img.pic{font-size:34px}
  .card .pics img.pic[style]{font-size:64px!important}
  .card .word{font-size:26px}
  .card .row{margin-top:8px}
}
/* ---------- clay look: chunky, soft, toy-like; everything presses down when touched ---------- */
.tile{box-shadow:inset 0 -7px 0 rgba(0,0,0,.14),inset 0 4px 0 rgba(255,255,255,.28),0 6px 0 rgba(0,0,0,.16);transition:transform .15s ease-out,box-shadow .15s ease-out}
.tile:active{transform:translateY(4px) scale(.98);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.28),0 2px 0 rgba(0,0,0,.16)}
.round,.item,.ans,.pick,.chip,.pill{box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--ink) 10%,transparent),0 4px 0 color-mix(in srgb,var(--ink) 14%,transparent);transition:transform .15s ease-out,box-shadow .15s ease-out}
.round:active,.item:active,.ans:active,.pick:active,.chip:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--ink) 10%,transparent),0 1px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
.round img.pic{font-size:34px}
.pill img.pic{font-size:24px}
.stars img.pic{font-size:18px}
.card .bigstars img.pic{font-size:42px}
.gear img.pic{font-size:26px}
.phrases img.pic{font-size:20px}
/* keep writing: the one big next step */
.hero{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:28px;text-align:left;color:#fff;
  background:var(--hero,var(--sky));box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),inset 0 4px 0 rgba(255,255,255,.3),0 6px 0 rgba(0,0,0,.16);transition:transform .15s ease-out}
.hero:active{transform:translateY(4px) scale(.99)}
.heroglyph{flex:none;width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.95);color:var(--hero,var(--sky));display:grid;place-items:center;padding:6px}
.heroglyph svg{height:100%;width:auto}
.herotext{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.herotext b{font:700 28px/1 var(--display)}
.herotext small{font-size:15px;opacity:.95}
.herotext .meter{background:rgba(255,255,255,.35);margin:4px 0 0;height:12px}
.herotext .meter i{background:#fff}
.heroplay{flex:none;font-size:52px;animation:bob 1.6s ease-in-out infinite}
.heroplay img.pic{font-size:52px}
.wmeter{margin:6px 0 4px}
/* real photos: framed like a printed picture */
img.photo{width:1em;height:1em;object-fit:cover;border-radius:18%;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);background:#fff;vertical-align:middle;pointer-events:none}
.pick img.photo{font-size:clamp(84px,25vw,150px)}
.pick{gap:6px;padding:12px 4px}
.pick small{font-size:18px}
#abc .picks{margin-block:auto}
.card .pics img.photo{font-size:150px}
@media (orientation:landscape) and (max-height:540px){.card .pics img.photo{font-size:96px!important}.pick img.photo{font-size:min(22vh,90px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (min-width:700px){ .menu{grid-template-columns:repeat(3,1fr)} .tile.wide{grid-column:span 1} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<section class="screen" id="home">
  <div class="bar"><button class="gear" id="gear" data-ico="Gear" aria-label="Grown-ups (press and hold)"></button><div class="grow"></div><div class="pill" id="homeStars"></div><button class="round" id="buddyBtn" aria-label="Change buddy"></button></div>
  <h1 class="hello" id="hello">Let's <span>write!</span></h1>
  <div class="menu">
    <button class="hero" id="hero" aria-label="Keep writing">
      <span class="heroglyph" id="heroGlyph"></span>
      <span class="herotext"><b>Keep writing!</b><small id="heroSub"></small><span class="meter"><i id="heroMeter"></i></span></span>
      <span class="heroplay" data-ico="Play button"></span>
    </button>
    <button class="tile t-lines" data-go="lines"><div class="art" id="artLines"></div><div><b>Lines</b><br><small>| — / ○</small></div></button>
    <button class="tile t-num" data-go="numbers"><div class="art" id="artNum"></div><div><b>Numbers</b><br><small>1 to 10</small></div></button>
    <button class="tile t-let" data-go="letters"><div class="art" id="artLet"></div><div><b>Letters</b><br><small>a to z</small></div></button>
    <button class="tile t-abc" data-go="abc"><div class="art" data-pics="Red apple,Soccer ball,Cat face"></div><div><b>a for apple</b><br><small>Find the picture</small></div></button>
    <button class="tile t-count" data-go="count"><div class="art" data-pics="Tangerine,Tangerine,Tangerine"></div><div><b>Count</b><br><small>How many?</small></div></button>
    <button class="tile t-add" data-go="add"><div class="art"><span class="op">2+1</span></div><div><b>Add</b><br><small>Put together</small></div></button>
    <button class="tile t-sub" data-go="sub"><div class="art"><span class="op">3−1</span></div><div><b>Take away</b><br><small>How many left?</small></div></button>
    <button class="tile t-pop" data-go="pop"><div class="art" data-pics="Balloon,Balloon"></div><div><b>Pop!</b><br><small>Find it fast</small></div></button>
    <button class="tile t-stick wide" data-go="stickers"><div class="art" id="stickPeek"></div><div><b>Stickers</b><br><small id="stickSub">Collect them all</small></div></button>
  </div>
</section>

<section class="screen" id="world" hidden>
  <div class="bar"><button class="round" data-home data-ico="House" aria-label="Home"></button><div class="wtitle grow" id="wTitle">Numbers</div><div class="pill" id="wStars"></div></div>
  <div class="meter wmeter"><i id="wMeter"></i></div>
  <div class="items" id="items"></div>
</section>

<section class="screen" id="trace" hidden>
  <div class="bar">
    <button class="round" id="tBack" data-ico="Left arrow" aria-label="Back"></button>
    <div class="grow" style="text-align:center"><span class="stars pill" id="tStars" style="display:inline-flex"></span></div>
    <button class="round" id="tErase" aria-label="Rub out and start again"></button>
    <button class="round" id="tWatch" data-ico="Eyes" aria-label="Watch again"></button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="stage" id="stageBox"><canvas id="cv"></canvas><div class="turnhint" id="turnHint">Turn the phone sideways to write more in a row</div></div>
</section>

<section class="screen" id="count" hidden>
  <div class="bar"><button class="round" data-home data-ico="House" aria-label="Home"></button><div class="grow"></div><div class="dots" id="cDots"></div><button class="round" id="cSay" data-ico="Speaker high volume" aria-label="Say again"></button></div>
  <div class="prompt" id="cPrompt">Tap each one to count!</div>
  <div class="countbox" id="cBox"></div>
  <div class="answers" id="cAns"></div>
</section>

<section class="screen" id="math" hidden>
  <div class="bar"><button class="round" data-home data-ico="House" aria-label="Home"></button><div class="grow"></div><div class="dots" id="mDots"></div><button class="round" id="mSay" data-ico="Speaker high volume" aria-label="Say again"></button></div>
  <div class="eq" id="mEq"></div>
  <div class="countbox mathbox" id="mBox"></div>
  <div class="answers" id="mAns"></div>
</section>

const LETTER_STROKES={

  k:[{b:['stand'],s:[L(30,10,30,90)]},{b:['slantL','slantR'],s:[L(68,50,32,72),L(32,72,70,90)]}],

  v:[{b:['slantR','slantL'],s:[L(28,50,50,90),L(50,90,72,50)]}],
  w:[{b:['slantR','slantL','slantR','slantL'],s:[L(16,50,31,90),L(31,90,50,60),L(50,60,69,90),L(69,90,84,50)]}],
  x:[{b:['slantR'],s:[L(30,50,70,90)]},{b:['slantL'],s:[L(70,50,30,90)]}],
  y:[{b:['slantR'],s:[L(30,50,50,88)]},{b:['slantL'],s:[L(70,50,34,125)]}],
  z:[{b:['sleep','slantL','sleep'],s:[L(30,50,70,50),L(70,50,30,90),L(30,90,70,90)]}]
};
const NUMBER_STROKES=[
  [{b:['stand'],s:[L(50,10,50,90)]}],
  [{b:['curveR','sleep'],s:[A(50,32,20,20,-160,25),L(68.1,40.5,30,90),L(30,90,72,90)]}],
  [{b:['curveR','curveR'],s:[A(48,30,19,19,-155,90),A(48,69,21,21,-90,150)]}],
  [{b:['slantL','sleep'],s:[L(58,10,24,64),L(24,64,76,64)]},{b:['stand'],s:[L(58,10,58,90)]}],
  [{b:['stand','curveR'],s:[L(33,10,32,50),A(47,65,21,21,-135,150)]},{b:['sleep'],s:[L(33,10,70,10)]}],
  [{b:['curveL','circle'],s:[A(54,62,24,52,-65,-180),A(50,70,20,20,180,-180)]}],
  [{b:['sleep','slantL'],s:[L(28,10,72,10),L(72,10,40,90)]}],
  [{b:['circle'],s:[A(50,30,17,19,-90,-450)]},{b:['circle'],s:[A(50,69.5,21,20.5,-90,-450)]}],
  [{b:['circle'],s:[A(50,30,20,20,-30,-390)]},{b:['stand'],s:[L(70,30,70,90)]}],
  [{b:['stand'],s:[L(30,10,30,90)]},{b:['circle'],s:[A(66,50,20,40,-90,-450)]}]
];
const NUMWORDS=['one','two','three','four','five','six','seven','eight','nine','ten'];

const WORLDS = {
  lines:{title:'Lines', color:'--grape', box:SQ, items:[
    {id:'stand', say:'stroke', intro:'ln_stand', strokes:[{b:['stand'],s:[L(50,12,50,88)],tip:'tip_top'}]},
    {id:'sleep', say:'dash', intro:'ln_sleep', strokes:[{b:['sleep'],s:[L(12,50,88,50)],tip:'tip_left'}]},
    {id:'slantL',say:'slanted stroke', intro:'ln_slant', strokes:[{b:['slantL'],s:[L(68,12,32,88)],tip:'tip_slide'}]},
    {id:'slantR',say:'slanted stroke', intro:'ln_slant', strokes:[{b:['slantR'],s:[L(32,12,68,88)],tip:'tip_slide'}]},
    {id:'curveL',say:'curve',         intro:'ln_curve', strokes:[{b:['curveL'],s:[A(62,50,28,38,-80,-280)]}]},
    {id:'curveR',say:'curve',         intro:'ln_curve', strokes:[{b:['curveR'],s:[A(38,50,28,38,-100,100)]}]},
    {id:'circle',say:'circle',        intro:'ln_circle',strokes:[{b:['circle'],s:[A(50,50,36,36,-90,-450)],tip:'tip_round'}]},
    {id:'cross', say:'cross',         intro:'ln_cross', strokes:[{b:['stand'],s:[L(50,12,50,88)]},{b:['sleep'],s:[L(12,50,88,50)]}]},
  ]},
  numbers:{title:'Numbers', color:'--sky', box:NUM,
    items:NUMBER_STROKES.map((strokes,i)=>({id:String(i+1),n:i+1,say:NUMWORDS[i],intro:'wrn_'+(i+1),strokes}))},
  letters:{title:'Letters', color:'--coral', box:LET,
    items:Object.keys(LETTER_STROKES).map(l=>({id:l,say:'the letter '+l.toUpperCase(),intro:'wr_'+l,strokes:LETTER_STROKES[l],
      words:((CONTENT.letters[l]||{}).words||[]).map((w,i)=>({word:w.w,pic:w.pic,end:!!w.end,key:`is_${l}_${i}`}))}))}
};
const STAGES=['Trace the road','Follow the dots','All by myself'];
const INK=['#ff6b4a','#3b8df0','#2bb673','#8a5cf0'];
/* praise alternates: "Good job!" then "Great job!" */
let praiseFlip=0;

/* ---------- geometry ---------- */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function rawPoints(segs){
  const pts=[];
  for(const s of segs){
    if(s.t==='L'){const n=Math.max(1,Math.ceil(Math.hypot(s.x2-s.x1,s.y2-s.y1)));
      for(let i=0;i<=n;i++)pts.push({x:s.x1+(s.x2-s.x1)*i/n,y:s.y1+(s.y2-s.y1)*i/n});}
    else{const n=Math.max(8,Math.ceil(Math.abs(s.a1-s.a0)*Math.PI/180*Math.max(s.rx,s.ry)));
      for(let i=0;i<=n;i++){const a=(s.a0+(s.a1-s.a0)*i/n)*Math.PI/180;pts.push({x:s.cx+s.rx*Math.cos(a),y:s.cy+s.ry*Math.sin(a)});}}
  }
  return pts;
}
function resample(raw,step=1){
  const out=[raw[0]];let prev=raw[0],acc=0;
  for(let i=1;i<raw.length;i++){
    let a=prev,b=raw[i],d=dist(a,b);
    while(d>0&&acc+d>=step){const t=(step-acc)/d;const q={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};out.push(q);a=q;d=dist(a,b);acc=0;}
    acc+=d;prev=b;
  }
  const last=raw[raw.length-1];if(dist(out[out.length-1],last)>.3)out.push(last);
  return out;
}
for(const [wk,w] of Object.entries(WORLDS)) for(const it of w.items){
  it.world=wk; it.box=w.box;
  it.cs=it.strokes.map(s=>s.dot?{dot:true,x:s.dot.x,y:s.dot.y,b:s.b}:{pts:resample(rawPoints(s.s)),b:s.b,tip:s.tip});
}
const ALL_ITEMS=Object.values(WORLDS).flatMap(w=>w.items);
const findItem=id=>ALL_ITEMS.find(i=>i.id===id);
const NUMS=WORLDS.numbers.items,LETS=WORLDS.letters.items;

function glyphSVG(it,color='currentColor',sw=9){
  const b=it.box;
  const body=it.cs.map(s=>s.dot?`<circle cx="${s.x}" cy="${s.y}" r="${sw*.7}" fill="${color}"/>`
    :`<polyline points="${s.pts.filter((_,i)=>i%2===0||i===s.pts.length-1).map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  return `<svg viewBox="0 0 ${b.w} ${b.h}" aria-label="${it.id}" role="img">${body}</svg>`;
}
const blockIcon=k=>`<svg viewBox="0 0 24 24"><path d="${BLOCKS[k].icon}" fill="none" stroke="currentColor" stroke-width="${k==='dot'?7:3}" stroke-linecap="round"/></svg>`;

/* ---------- pictures ---------- */
const picKey=name=>name.toLowerCase().replace(/ /g,'_');
const pic=(name,alt='')=>name&&PICS[picKey(name)]?`<img class="pic" src="${PICS[picKey(name)]}" alt="${alt}">`:'';
/* a word's picture: the real photo once photos.js has loaded, the cartoon until then */
const wordPic=w=>PHOTOS[w.word]?`<img class="photo" src="${PHOTOS[w.word]}" alt="${w.word}">`:(pic(w.pic,w.word)||pic('Star',w.word));
const STICKERS=CONTENT.stickers;
const BUDDY_IMGS=CONTENT.buddies.map(n=>{const i=new Image();i.src=PICS[picKey(n)]||'';return i;});

/* ---------- saved progress (this device only) ---------- */
const SAVE_KEY='little-writer-v1';
let S={stars:{},bonus:0,name:'',voice:true,sound:true,phonics:true,buddy:0,seen:0,reps:2};
try{Object.assign(S,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
const itemStars=id=>S.stars[id]||0;
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0)+S.bonus;
const stickersOwned=()=>Math.min(STICKERS.length,Math.floor(totalStars()/3));

/* ---------- sound effects ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur=.12,type='sine',vol=.18,when=0){
  if(!S.sound)return;const c=ac();if(!c)return;const t=c.currentTime+when;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02);
}
const PENTA=[523,587,659,784,880,1047,1175,1319,1568,1760,2093];
const sfx={
  step:i=>tone(PENTA[Math.min(PENTA.length-1,i)],.09,'triangle',.1),
  stroke:()=>{tone(784,.12,'sine',.14);tone(1175,.18,'sine',.14,.1);},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.14,i*.1)),
  boop:()=>tone(196,.18,'triangle',.12),
  pop:()=>{tone(900,.06,'square',.06);tone(300,.1,'triangle',.1,.03);},
  tick:()=>tone(1320,.06,'sine',.08)
};

/* ---------- voice: recorded clips (voice.js), falling back to the phone's own voice ---------- */
const V={el:new Audio(),token:0};
V.el.preload='auto';
const clipOK=k=>window.CLIPS&&CLIPS[k];
function stopVoice(){V.token++;try{V.el.pause();}catch(e){}try{speechSynthesis.cancel();}catch(e){}}
function speak(keys){
  keys=[].concat(keys).filter(Boolean);stopVoice();
  if(!S.voice||!keys.length)return Promise.resolve();
  const tok=V.token;
  if(keys.every(clipOK))return new Promise(res=>{
    const next=i=>{ if(tok!==V.token||i>=keys.length)return res();
      V.el.src=CLIPS[keys[i]];V.el.onended=()=>setTimeout(()=>next(i+1),80);V.el.onerror=V.el.onended;
      V.el.play().catch(()=>res()); };
    next(0);});
  return ttsSay(keys.map(k=>PHRASES[k]||'').join(' '));
}
let TTS_VOICE=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  TTS_VOICE=v.find(v=>/en-NG/i.test(v.lang))||v.find(v=>/natural|neural/i.test(v.name))||v.find(v=>/GB/i.test(v.lang))||v[0]||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function ttsSay(text){return new Promise(res=>{
  if(!text||!('speechSynthesis' in window))return res();
  try{const u=new SpeechSynthesisUtterance(text);u.rate=.9;u.pitch=1.1;if(TTS_VOICE)u.voice=TTS_VOICE;u.onend=res;u.onerror=res;speechSynthesis.speak(u);}catch(e){res();}});}
const praiseKey=()=>(praiseFlip^=1)?'p7':'p9';
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
</script>

<script>
const $=id=>document.getElementById(id);
const SCREENS=['home','world','trace','count','math','abc','pop','stickers'];
let onLeave=null;
function show(id){
  if(onLeave){const f=onLeave;onLeave=null;f();}
  stopVoice();
  SCREENS.forEach(s=>$(s).hidden=s!==id);
  hideOverlay();
}
/* first touch unlocks sound on phones */
document.addEventListener('pointerdown',()=>{ac();try{V.el.muted=true;V.el.play().catch(()=>{}).finally(()=>{V.el.pause();V.el.muted=false;});}catch(e){}},{once:true});
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>goHome());

/* ---------- home ---------- */
function goHome(){
  show('home');
  $('hello').innerHTML=S.name?`Hi, <span>${escapeHTML(S.name)}!</span>`:`Let's <span>write!</span>`;
  $('homeStars').innerHTML=pic('Star')+' '+totalStars();
  renderHero();
  $('buddyBtn').innerHTML=pic(CONTENT.buddies[S.buddy%CONTENT.buddies.length],'buddy');
  const own=stickersOwned();
  $('stickPeek').innerHTML=own?STICKERS.slice(Math.max(0,own-4),own).map(n=>pic(n)).join(''):pic('Glowing star');
  $('stickSub').textContent=`${own} of ${STICKERS.length} collected`;
}
/* the one obvious next step: the first shape not yet practised enough, strokes then numbers then letters */
function nextToPractise(){
  const need=Math.min(3,S.reps||2),order=['lines','numbers','letters'].flatMap(k=>WORLDS[k].items);
  return order.find(i=>itemStars(i.id)<need)||order.find(i=>itemStars(i.id)<3)||WORLDS.letters.items[0];
}
function renderHero(){
  const it=nextToPractise(),w=WORLDS[it.world],need=Math.min(3,S.reps||2);
  const done=w.items.filter(i=>itemStars(i.id)>=need).length;
  $('hero').style.setProperty('--hero',`var(${w.color})`);
  $('heroGlyph').innerHTML=glyphSVG(it,'currentColor',11);
  $('heroSub').textContent=`${w.title}: ${done} of ${w.items.length} done`;
  $('heroMeter').style.width=(100*done/w.items.length)+'%';
  $('hero').onclick=()=>startTrace(it,Math.min(2,itemStars(it.id)),0,true);
}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('artLines').innerHTML=['stand','slantL','circle'].map(id=>glyphSVG(findItem(id),'#fff',11)).join('');
$('artNum').innerHTML=['1','2','3'].map(id=>glyphSVG(findItem(id),'#fff',11)).join('');
$('artLet').innerHTML=['a','b','c'].map(id=>glyphSVG(findItem(id),'#fff',11)).join('');
document.querySelectorAll('[data-pics]').forEach(el=>el.innerHTML=el.dataset.pics.split(',').map(n=>pic(n)).join(''));
$('tErase').innerHTML=pic('Sponge','rub out');
document.querySelectorAll('[data-ico]').forEach(el=>el.innerHTML=pic(el.dataset.ico));
$('buddyBtn').onclick=()=>{S.buddy=(S.buddy+1)%CONTENT.buddies.length;save();$('buddyBtn').innerHTML=pic(CONTENT.buddies[S.buddy],'buddy');sfx.tick();};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
  const g=b.dataset.go;
  if(WORLDS[g]){openWorld(g);speak('t_'+g);}
  else if(g==='count')startCount();
  else if(g==='add')startMath('add');
  else if(g==='sub')startMath('sub');
  else if(g==='abc')startAbc();
  else if(g==='pop'){choosePop();speak('t_pop');}
  else if(g==='stickers'){openStickers();speak('t_stickers');}
});

/* ---------- world grid ---------- */
let curWorld='numbers';
function openWorld(wk){
  curWorld=wk;show('world');
  const w=WORLDS[wk];$('wTitle').textContent=w.title;
  const got=w.items.reduce((a,i)=>a+itemStars(i.id),0),max=w.items.length*3;
  $('wStars').innerHTML=pic('Star')+` ${got}/${max}`;$('wMeter').style.width=(100*got/max)+'%';
  const nextIt=w.items.find(i=>itemStars(i.id)<1)||w.items.find(i=>itemStars(i.id)<3);
  $('items').innerHTML=w.items.map(it=>`<button class="item${it===nextIt?' next':''}" data-id="${it.id}" style="color:var(${w.color})" aria-label="${it.say}">
    ${glyphSVG(it)}<span class="stars">${starStr(itemStars(it.id))}</span></button>`).join('');
  $('items').querySelectorAll('.item').forEach(b=>b.onclick=()=>{const it=findItem(b.dataset.id);startTrace(it,Math.min(2,itemStars(it.id)));});
  nextIt&&$('items').querySelector('.next')?.scrollIntoView({block:'nearest'});
}
const starStr=n=>[0,1,2].map(i=>`<span class="${i<n?'':'off'}">${pic('Star')}</span>`).join('');

/* ---------- overlay + confetti ---------- */
function showOverlay(html){$('ovCard').innerHTML=html;$('ov').hidden=false;}
function hideOverlay(){$('ov').hidden=true;}
const cf=$('confetti'),cfx=cf.getContext('2d');let parts=[],cfRun=false;
function confetti(n=120){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const dpr=devicePixelRatio||1;cf.width=innerWidth*dpr;cf.height=innerHeight*dpr;cfx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#ff6b4a','#ffc23d','#2bb673','#3b8df0','#8a5cf0','#e0457b'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:rnd(cols),a:Math.random()*6,life:1});
  if(!cfRun){cfRun=true;requestAnimationFrame(cfTick);}
}
function cfTick(){
  cfx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+20);
  for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=.2;p.life-=.008;
    cfx.save();cfx.translate(p.x,p.y);cfx.rotate(p.a);cfx.fillStyle=p.c;cfx.globalAlpha=Math.max(0,p.life);cfx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cfx.restore();}
  if(parts.length)requestAnimationFrame(cfTick);else{cfRun=false;cfx.clearRect(0,0,innerWidth,innerHeight);}
}
function award(n,itemId){
  const before=stickersOwned();
  if(itemId)S.stars[itemId]=Math.max(itemStars(itemId),n);else S.bonus+=n;
  save();
  const after=stickersOwned();
  return after>before?STICKERS[after-1]:null;
}
const stickerHTML=s=>s?`<div class="newsticker">New sticker! <span style="font-size:48px">${pic(s)}</span></div>`:'';
</script>

<script>
/* ---------- tracing: a worksheet row of copies, like an exercise book ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let T=null,SL=null,raf=0,colors={};
function readColors(){const cs=getComputedStyle(document.documentElement);
  ['--paper','--road','--road-edge','--line-red','--line-blue','--muted','--leaf','--sun','--ink'].forEach(k=>colors[k]=cs.getPropertyValue(k).trim());}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',readColors);
const imgOf=n=>{const i=new Image();i.src=PICS[picKey(n)]||'';return i;};
const STAR_IMG=imgOf('Glowing star'),PENCIL_IMG=imgOf('Pencil');

/* which guide each copy gets (0 road, 1 dots, 2 by myself), by how many rows are already done */
const PLAN=[[0,0,1,1],[0,1,1,2],[1,2,2,2]];
function planFor(level,n){const row=PLAN[Math.min(2,level)];
  return n===1?[Math.min(2,level)]:Array.from({length:n},(_,i)=>row[Math.round(i*3/(n-1))]);}

/* level = guide level for this row; visit = rows already done in this sitting; fresh = new item (show the demo) */
function startTrace(it,level=0,visit=0,fresh=true){
  show('trace');readColors();
  T={it,level:Math.min(2,level),visit,fresh,n:0,slots:[],ci:0,si:0,p:0,active:null,last:null,demo:null,locked:true,lastStep:0,nudge:0,idle:performance.now()};
  $('tStars').innerHTML=starStr(itemStars(it.id));
  fit();
  T.slots=planFor(T.level,T.n).map(stage=>({stage,done:[],ink:it.cs.map(()=>[]),finished:false}));fit();
  renderChips();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
  onLeave=()=>{cancelAnimationFrame(raf);T=null;};
  if(fresh){speak([it.intro,'watch']);setTimeout(()=>T&&T.it===it&&playDemo(),1500);}
  else{T.locked=false;renderChips();speak(['again',...strokeWords(it.cs[0])]);}
}
const cur=()=>T.slots[T.ci];
/* how far (in shape units) the finger may be from the line: about half the road, a bit more when writing alone */
const tolFor=stage=>Math.max(20,T.road*[.62,.6,.72][stage])/T.sc;
const offFor=stage=>tolFor(stage)*1.7;
/* distance from a point to the current stroke, looking near where he has got to */
function nearDist(q){const s=T.it.cs[T.si],a=Math.max(0,T.p-12),b=Math.min(s.pts.length-1,T.p+20);let d=1e9;for(let j=a;j<=b;j++)d=Math.min(d,dist(q,s.pts[j]));return d;}
function renderChips(){
  if(!T)return;const all=[];T.it.cs.forEach((s,si)=>s.b.forEach(k=>all.push({k,si})));
  $('chips').innerHTML=all.map(c=>`<button class="chip ${c.si===T.si&&!T.locked?'on':''} ${c.si<T.si?'done':''}" data-k="${c.k}" aria-label="${BLOCKS[c.k].name}">${blockIcon(c.k)}<span class="cname">${BLOCKS[c.k].name}</span></button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>speak(BLOCKS[b.dataset.k].key));
}
/* lay the copies out side by side (phone sideways) or stacked (phone upright), as many as fit at a finger-friendly size */
function fit(){
  const r=$('stageBox').getBoundingClientRect(),dpr=devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);cx.setTransform(dpr,0,0,dpr,0,0);
  if(!T)return;const b=T.it.box,W=r.width,H=r.height,pad=16,gap=18,horiz=W>=H*1.1;
  const scFor=n=>horiz?Math.min((W-pad*2-gap*(n-1))/n/b.w,(H-pad*2)/b.h):Math.min((W-pad*2)/b.w,(H-pad*2-gap*(n-1))/n/b.h);
  if(!T.n){T.n=1;for(let k=horiz?4:2;k>1;k--)if(scFor(k)>=1.85){T.n=k;break;}}
  const n=T.n,sc=scFor(n),gw=b.w*sc,gh=b.h*sc;
  T.sc=sc;T.W=W;T.H=H;T.horiz=horiz;T.road=Math.max(30,14*sc);
  const x0=horiz?(W-(gw*n+gap*(n-1)))/2:(W-gw)/2,y0=horiz?(H-gh)/2:(H-(gh*n+gap*(n-1)))/2;
  T.pos=Array.from({length:n},(_,i)=>({ox:horiz?x0+i*(gw+gap):x0,oy:horiz?y0:y0+i*(gh+gap)}));
  T.slots.forEach((s,i)=>Object.assign(s,T.pos[i]));
}
addEventListener('resize',()=>T&&fit());
const P=p=>({x:SL.ox+p.x*T.sc,y:SL.oy+p.y*T.sc});

function playDemo(){
  if(!T)return;T.locked=true;T.demo={i:0,t0:performance.now()};renderChips();
  speak(strokeWords(T.it.cs[0]));
}
function resetCopy(){const s=cur();s.done=[];s.ink=T.it.cs.map(()=>[]);T.si=0;T.p=0;T.active=null;T.lastStep=0;}
$('tWatch').onclick=()=>{if(!T||T.demo||!cur())return;resetCopy();playDemo();};
/* eraser: rub out the copy he is working on and start it again */
$('tErase').onclick=()=>{if(!T||T.demo||!cur())return;resetCopy();T.locked=false;renderChips();T.idle=performance.now();
  sfx.tick();speak(['erase',...strokeWords(T.it.cs[0])]);};
$('tBack').onclick=()=>openWorld(T?T.it.world:curWorld);

function demoLen(s){return s.dot?600:Math.min(2800,Math.max(1300,s.pts.length*17));}
function stepDemo(now){
  const d=T.demo,s=T.it.cs[d.i];const k=Math.min(1,(now-d.t0)/demoLen(s));
  if(k>=1){
    d.i++;d.t0=now+300;
    if(d.i>=T.it.cs.length){T.demo=null;setTimeout(beginTracing,400);}
    else speak(strokeWords(T.it.cs[d.i]));
  }
  return k;
}
/* voice keys for a stroke: its tip, or its blocks joined with "then" */
function strokeWords(s){if(s.tip)return[s.tip];const out=[];s.b.forEach((k,i)=>{if(i)out.push('then');out.push(BLOCKS[k].key);});return out;}
function beginTracing(){
  if(!T)return;resetCopy();T.locked=false;renderChips();T.idle=performance.now();
  speak([S.seen<3?'turn_first':'turn',...strokeWords(T.it.cs[0])]);S.seen++;save();
}

/* input */
function toUnits(e){const r=cv.getBoundingClientRect(),s=cur();return{x:(e.clientX-r.left-s.ox)/T.sc,y:(e.clientY-r.top-s.oy)/T.sc};}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();ac();if(!T||T.locked||T.active!==null||!cur())return;
  const u=toUnits(e),s=T.it.cs[T.si];T.idle=performance.now();
  if(s.dot){ if(dist(u,s)<tolFor(cur().stage)*1.5){cur().ink[T.si].push([u]);completeStroke();} else nudge(); return; }
  const here=s.pts[T.p];
  if(dist(u,here)<=tolFor(cur().stage)*1.5){T.active=e.pointerId;T.last=u;try{cv.setPointerCapture(e.pointerId);}catch(_){}cur().ink[T.si].push([u]);advance(u);}
  else nudge();
});
cv.addEventListener('pointermove',e=>{
  if(!T||e.pointerId!==T.active)return;
  const u=toUnits(e),from=T.last,d=dist(from,u),n=Math.max(1,Math.ceil(d/1.5)),si=T.si,slot=cur();
  T.idle=performance.now();
  for(let i=1;i<=n&&T.active!==null&&cur()===slot&&T.si===si;i++){
    const q={x:from.x+(u.x-from.x)*i/n,y:from.y+(u.y-from.y)*i/n};
    if(nearDist(q)>offFor(slot.stage)){offTrack();break;}
    if(slot.stage===2){const st=slot.ink[si];if(st&&st.length)st[st.length-1].push(q);}
    advance(q);
  }
  T.last=u;
});
const endPtr=e=>{if(T&&e.pointerId===T.active){T.active=null;if(!T.locked&&nearEnd())completeStroke();}};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);

/* close enough to the end of the stroke to count it (a small child often stops just short) */
function nearEnd(){const s=T.it.cs[T.si];return s&&!s.dot&&T.p>=s.pts.length-1-Math.max(3,tolFor(cur().stage)*.6);}
function advance(q){
  const s=T.it.cs[T.si];if(!s||s.dot)return;
  const tol=tolFor(cur().stage),end=Math.min(s.pts.length-1,T.p+12);
  let best=-1,bd=1e9;
  for(let j=T.p;j<=end;j++){const d=dist(q,s.pts[j]);if(d<tol&&d<bd){bd=d;best=j;}}
  if(best>T.p){
    T.p=best;const frac=T.p/(s.pts.length-1),stepI=Math.floor(frac*10);
    if(stepI>T.lastStep){T.lastStep=stepI;sfx.step(stepI);}
    if(nearEnd())completeStroke();
  }
}
/* finger wandered off the line: stop, wobble, and let him carry on from where he left it */
function offTrack(){T.active=null;T.nudge=performance.now();sfx.boop();
  if(performance.now()-(T.lastNudgeSay||0)>2500){T.lastNudgeSay=performance.now();speak('offtrack');}}
function nudge(){T.nudge=performance.now();sfx.boop();
  if(performance.now()-(T.lastNudgeSay||0)>4000){T.lastNudgeSay=performance.now();speak(T.it.cs[T.si].dot?'tapdot':'green');}}
function completeStroke(){
  const slot=cur();slot.done.push(T.si);T.active=null;T.lastStep=0;
  if(T.si+1<T.it.cs.length){sfx.stroke();T.si++;T.p=0;renderChips();speak(strokeWords(T.it.cs[T.si]));return;}
  slot.finished=true;T.si=0;T.p=0;
  if(T.ci+1<T.slots.length){ // on to the next copy in the row
    sfx.win();T.ci++;renderChips();T.idle=performance.now();
    speak([praiseKey(),...strokeWords(T.it.cs[0])]);return;}
  T.ci=T.slots.length;T.locked=true;renderChips();finishRow();
}
const pickWord=it=>it.words.length?rnd(it.words):null;
function finishRow(){
  const it=T.it,level=T.level,visit=T.visit+1;
  sfx.win();confetti();
  const sticker=award(level+1,it.id);
  const word=it.world==='letters'?pickWord(it):null;
  const keys=[praiseKey()];
  if(word){keys.push(word.key);if(S.phonics)keys.push('snd_'+it.id);}
  else if(it.world==='lines'&&it.id!=='cross')keys.push(BLOCKS[it.cs[0].b[0]].key);
  if(sticker)keys.push('sticker');
  speak(keys);
  setTimeout(()=>{ if(!T||T.it!==it)return; rewardCard(it,level,visit,sticker,word); },1100);
}
function wordHTML(word,l){const i=word.indexOf(l);return i<0?word:`${word.slice(0,i)}<em>${l}</em>${word.slice(i+1)}`;}
/* after a row: practise the same one again until the grown-up's number of rows is reached, then move to the next one */
function nextStep(it,level,visit){
  const w=WORLDS[it.world],idx=w.items.indexOf(it);
  if(visit<(S.reps||2))return()=>startTrace(it,level+1,visit,false);
  if(idx+1>=w.items.length)return()=>openWorld(it.world);
  const nx=w.items[idx+1];return()=>startTrace(nx,Math.min(2,itemStars(nx.id)),0,true);
}
function rewardCard(it,level,visit,sticker,word){
  const w=WORLDS[it.world],stars=itemStars(it.id),go=nextStep(it,level,visit);
  let mid='',extra=0;
  if(it.world==='numbers'){const thing=CONTENT.countThings[(it.n-1)%CONTENT.countThings.length];
    mid=`<div class="pics" id="rPics"></div>`;extra=3100+it.n*850;
    (async()=>{await wait(1800);let box=$('rPics');if(!box)return;speak('count_them');await wait(1300);
      for(let k=1;k<=it.n;k++){box=$('rPics');if(!box||$('ov').hidden)return;
        box.insertAdjacentHTML('beforeend',`<span>${pic(thing)}</span>`);sfx.step(k);speak('n_'+k);await wait(850);}})();}
  else if(word){mid=`<div class="pics">${wordPic(word)}</div><div class="word">${wordHTML(word.word,it.id)}</div>`;extra=1500;}
  else mid=`<div class="word">${it.say}</div>`;
  showOverlay(`<div class="bigstars">${starStr(stars)}</div>
    <div class="glyphbox" style="color:var(${w.color})">${glyphSVG(it).replace('<svg','<svg style="height:100%"')}</div>
    ${mid}${stickerHTML(sticker)}
    <div class="row"><button class="round" id="rAgain" aria-label="Again">${pic('Repeat button')}</button>
    <button class="round go" id="rNext" aria-label="Next">${pic('Play button')}</button>
    <button class="round" id="rHome" aria-label="Home">${pic('House')}</button></div>`);
  let timer=0;const stop=()=>clearTimeout(timer);
  $('rAgain').onclick=()=>{stop();startTrace(it,level,visit-1,false);};
  $('rNext').onclick=()=>{stop();go();};
  $('rHome').onclick=()=>{stop();openWorld(it.world);};
  /* carry on by itself after a short pause, with a ring filling round the play button */
  const delay=2600+extra;
  $('rNext').style.setProperty('--wait',(delay/1000)+'s');$('rNext').classList.add('counting');
  timer=setTimeout(()=>{if(!$('ov').hidden&&$('rNext'))go();},delay);
}

/* drawing */
function path(pts,from=0,to=pts.length-1){cx.beginPath();const a=P(pts[from]);cx.moveTo(a.x,a.y);for(let i=from+1;i<=to;i++){const q=P(pts[i]);cx.lineTo(q.x,q.y);}}
function strokeStyle(c,w){cx.strokeStyle=c;cx.lineWidth=w;cx.lineCap='round';cx.lineJoin='round';cx.stroke();}
function img(im,p,size){if(im&&im.complete&&im.naturalWidth)cx.drawImage(im,p.x-size/2,p.y-size/2,size,size);}
function drawInk(list,c,w){for(const seg of list){if(seg.length===1){const q=P(seg[0]);cx.beginPath();cx.arc(q.x,q.y,w/2,0,7);cx.fillStyle=c;cx.fill();continue;}
  cx.beginPath();seg.forEach((u,i)=>{const q=P(u);i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y);});strokeStyle(c,w);}}
function drawLines(){
  const rows=T.horiz?[T.slots[0]||T.pos[0]]:(T.slots.length?T.slots:T.pos);
  for(const r of rows)for(const [y,kind] of T.it.box.lines){const py=r.oy+y*T.sc;cx.beginPath();cx.setLineDash(kind==='d'?[10,10]:[]);
    cx.moveTo(10,py);cx.lineTo(T.W-10,py);cx.strokeStyle=kind==='r'?colors['--line-red']:colors['--line-blue'];cx.lineWidth=kind==='d'?2:3;cx.stroke();}
  cx.setLineDash([]);
}
function drawGuide(stage,strong){ // the shape to follow: road, dots, or nothing
  const road=T.road;
  for(const s of T.it.cs){
    if(s.dot){const q=P(s);cx.beginPath();cx.arc(q.x,q.y,road*.45,0,7);cx.fillStyle=colors['--road'];cx.fill();continue;}
    if(stage===0||strong){path(s.pts);strokeStyle(colors['--road-edge'],road+4);path(s.pts);strokeStyle(colors['--road'],road);}
    else{ // dots on every copy; the last copies get fewer, lighter dots and no bee
      const gap=stage===2?9:7,r=Math.max(3.5,road*(stage===2?.1:.11));
      cx.save();if(stage===2)cx.globalAlpha*=.6;
      for(let j=0;j<s.pts.length;j+=gap){const q=P(s.pts[j]);cx.beginPath();cx.arc(q.x,q.y,r,0,7);cx.fillStyle=colors['--muted'];cx.fill();}
      cx.restore();}
  }
}
function drawDone(slot){
  slot.done.forEach(i=>{const s=T.it.cs[i];
    if(slot.stage===2)drawInk(slot.ink[i],INK[i%4],T.road*.5);
    else if(s.dot){const q=P(s);cx.beginPath();cx.arc(q.x,q.y,T.road*.38,0,7);cx.fillStyle=INK[i%4];cx.fill();}
    else{path(s.pts);strokeStyle(INK[i%4],T.road*.6);}});
}
function frame(now){
  raf=requestAnimationFrame(frame);if(!T||!T.slots.length)return;
  const cs=T.it.cs,road=T.road;
  cx.clearRect(0,0,T.W,T.H);
  drawLines();
  T.slots.forEach((slot,idx)=>{
    SL=slot;
    if(slot.finished){drawDone(slot);return;}
    if(idx!==T.ci){cx.globalAlpha=.55;drawGuide(slot.stage);cx.globalAlpha=1;return;}
    drawCurrent(slot,now);
  });
}
function drawCurrent(slot,now){
  const cs=T.it.cs,road=T.road,stage=slot.stage;
  drawGuide(stage,!!T.demo);
  if(T.demo){const k=stepDemo(now);if(!T.demo)return;
    cs.forEach((s,i)=>{if(i>T.demo.i)return;const kk=i<T.demo.i?1:Math.max(0,k);
      if(s.dot){if(kk>.2){const q=P(s);cx.beginPath();cx.arc(q.x,q.y,road*.35,0,7);cx.fillStyle=INK[i%4];cx.fill();}return;}
      const to=Math.max(1,Math.floor(kk*(s.pts.length-1)));path(s.pts,0,to);strokeStyle(INK[i%4],road*.55);
      if(i===T.demo.i){const tip=P(s.pts[to]);img(PENCIL_IMG,{x:tip.x+road*.4,y:tip.y-road*.5},road*1.2);}});
    return;}
  drawDone(slot);
  const s=cs[T.si];if(!s)return;
  if(s.dot){const q=P(s),pulse=1+.15*Math.sin(now/180);cx.beginPath();cx.arc(q.x,q.y,road*.45*pulse,0,7);cx.fillStyle=colors['--leaf'];cx.fill();return;}
  const pts=s.pts,n=pts.length;
  if(stage===0){ // chevrons showing direction
    for(let j=14;j<n-10;j+=22){const a=P(pts[j]),b=P(pts[Math.min(n-1,j+2)]),ang=Math.atan2(b.y-a.y,b.x-a.x),r=road*.18;
      cx.save();cx.translate(a.x,a.y);cx.rotate(ang);cx.beginPath();cx.moveTo(r,0);cx.lineTo(-r,-r);cx.lineTo(-r*.3,0);cx.lineTo(-r,r);cx.closePath();cx.fillStyle=colors['--road-edge'];cx.fill();cx.restore();}
  }
  // hint if a child is stuck in "by myself"
  if(stage===2&&now-T.idle>7000){path(pts);cx.globalAlpha=.35;strokeStyle(colors['--road-edge'],road*.4);cx.globalAlpha=1;}
  if(stage<2&&T.p>0){path(pts,0,T.p);strokeStyle(INK[T.si%4],road*.6);}
  if(stage===2)drawInk(slot.ink[T.si],INK[T.si%4],road*.5);
  if(stage<2)img(STAR_IMG,P(pts[n-1]),road*1.05);
  const here=P(pts[T.p]),shake=now-T.nudge<500?Math.sin(now/30)*6:0,pulse=1+.18*Math.sin(now/200);
  if(T.active===null){cx.beginPath();cx.arc(here.x+shake,here.y,road*.55*pulse,0,7);cx.fillStyle=colors['--leaf'];cx.globalAlpha=.9;cx.fill();cx.globalAlpha=1;}
  if(stage<2)img(BUDDY_IMGS[S.buddy%BUDDY_IMGS.length],{x:here.x+shake,y:here.y},road*1.05);
  else if(T.active===null&&T.p===0){const b=P(pts[Math.min(n-1,10)]),ang=Math.atan2(b.y-here.y,b.x-here.x);
    cx.save();cx.translate(here.x,here.y);cx.rotate(ang);cx.fillStyle='#fff';cx.beginPath();cx.moveTo(road*.3,0);cx.lineTo(-road*.15,-road*.2);cx.lineTo(-road*.15,road*.2);cx.fill();cx.restore();}
}
</script>

<script>
const ROUNDS=5;
const dotsHTML=(n,on)=>Array.from({length:n},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('');
const rint=n=>Math.floor(Math.random()*n);
const numSVG=(k,c='currentColor',sw=11)=>glyphSVG(NUMS[k-1],c,sw);
function shakeEl(b,cls='wrong'){b.classList.remove(cls);void b.offsetWidth;b.classList.add(cls);sfx.boop();}
function roundWin(title,again){
  sfx.win();confetti(160);const sticker=award(1);
  speak([praiseKey(),'star',sticker?'sticker':null]);
  setTimeout(()=>{showOverlay(`<div class="bigstars">${pic('Star')}</div><div class="big" style="font-size:48px">${title}</div>${stickerHTML(sticker)}
    <div class="row"><button class="round" id="gAgain" aria-label="Play again">${pic('Repeat button')}</button><button class="round" id="gHome" aria-label="Home">${pic('House')}</button></div>`);
    $('gAgain').onclick=again;$('gHome').onclick=goHome;},900);
}
/* three answer choices around the right number, all between 1 and 10 */
function numChoices(ans){const o=new Set([ans]);while(o.size<3){const k=ans+rint(7)-3;if(k>=1&&k<=10)o.add(k);}return shuffle([...o]);}
function thingBtn(name){return `<button class="thing" aria-label="count">${pic(name)}</button>`;}
function makeCountable(root,state,onDone){
  root.querySelectorAll('.thing:not(.gone)').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('counted')||b.classList.contains('gone'))return;state.counted++;b.classList.add('counted');
    b.insertAdjacentHTML('beforeend',`<span class="n">${state.counted}</span>`);sfx.step(state.counted);speak('n_'+state.counted);
    onDone&&onDone();
  });
}

/* ---------- Count: tap each thing, then pick the number ---------- */
let C=null;
function startCount(){show('count');C={round:0,max:Math.min(10,5+Math.floor(totalStars()/15))};onLeave=()=>{C=null;};nextCount();}
function nextCount(){
  if(!C)return;$('cDots').innerHTML=dotsHTML(ROUNDS,C.round);
  C.n=1+rint(C.max);C.counted=0;const thing=rnd(CONTENT.countThings);
  $('cBox').innerHTML=Array.from({length:C.n},()=>thingBtn(thing)).join('');
  $('cAns').innerHTML='';$('cPrompt').textContent='Tap each one to count!';
  speak('count_tap');
  makeCountable($('cBox'),C,()=>{if(C.counted===C.n)setTimeout(askCount,900);});
}
function askCount(){
  if(!C)return;$('cPrompt').textContent='Which number?';speak(['which']);
  $('cAns').innerHTML=numChoices(C.n).map(k=>`<button class="ans" data-n="${k}" style="color:var(--sky)" aria-label="${k}">${numSVG(k)}</button>`).join('');
  $('cAns').querySelectorAll('.ans').forEach(b=>b.onclick=()=>{
    if(!C)return;const k=+b.dataset.n;
    if(k===C.n){b.classList.add('right');b.style.color='#fff';sfx.stroke();C.round++;$('cDots').innerHTML=dotsHTML(ROUNDS,C.round);
      if(C.round>=ROUNDS)roundWin('Counting star!',startCount);else{speak(['n_'+k,praiseKey()]);setTimeout(nextCount,2200);}}
    else{shakeEl(b);speak(['thatn_'+k,'tryagain']);}
  });
}
$('cSay').onclick=()=>{if(C)speak(C.counted<C.n?'count_tap':'which');};

/* ---------- Add and Take away, with pictures to count ---------- */
let M=null;
function startMath(mode){show('math');M={mode,round:0,first:true,tok:0};onLeave=()=>{M=null;};nextMath();}
async function nextMath(){
  if(!M)return;const tok=++M.tok,live=()=>M&&M.tok===tok;
  $('mDots').innerHTML=dotsHTML(ROUNDS,M.round);
  const max=totalStars()>=30?10:5,add=M.mode==='add';
  let a,b;
  if(add){a=1+rint(max-1);b=1+rint(max-a);M.ans=a+b;}else{a=2+rint(max-1);b=1+rint(a-1);M.ans=a-b;}
  M.a=a;M.b=b;M.counted=0;const thing=rnd(CONTENT.countThings);
  $('mEq').innerHTML=`<span style="color:var(--sky)">${numSVG(a)}</span><span>${add?'+':'−'}</span><span style="color:var(--coral)">${numSVG(b)}</span><span>=</span><span class="q" id="mQ">?</span>`;
  $('mBox').innerHTML=add
    ?`<div class="group">${Array.from({length:a},()=>thingBtn(thing)).join('')}</div><span class="sign">+</span><div class="group">${Array.from({length:b},()=>thingBtn(thing)).join('')}</div>`
    :`<div class="group" style="max-width:100%">${Array.from({length:a},()=>thingBtn(thing)).join('')}</div>`;
  $('mAns').innerHTML='';
  const intro=M.first?[add?'add_intro':'sub_intro']:[];M.first=false;
  await speak([...intro,'n_'+a,add?'plus':'take','n_'+b]);if(!live())return;
  if(!add){ // some of them go away
    const all=[...$('mBox').querySelectorAll('.thing')];
    all.slice(-b).forEach((el,i)=>setTimeout(()=>{el.classList.add('flyaway','gone');},i*250));
    sfx.pop();await speak('fly');await wait(500+b*250);if(!live())return;
  }
  makeCountable($('mBox'),M);
  $('mAns').innerHTML=numChoices(M.ans).map(k=>`<button class="ans" data-n="${k}" style="color:var(--sky)" aria-label="${k}">${numSVG(k)}</button>`).join('');
  $('mAns').querySelectorAll('.ans').forEach(btn=>btn.onclick=()=>answerMath(btn,tok));
  speak(add?'altogether':'left');
}
async function answerMath(btn,tok){
  if(!M||M.tok!==tok||M.done===tok)return;const k=+btn.dataset.n,add=M.mode==='add';
  if(k!==M.ans){shakeEl(btn);speak(['thatn_'+k,'tryagain']);return;}
  M.done=tok;btn.classList.add('right');btn.style.color='#fff';sfx.stroke();
  const q=$('mQ');q.classList.remove('q');q.style.color='var(--leaf)';q.innerHTML=numSVG(k);
  M.round++;$('mDots').innerHTML=dotsHTML(ROUNDS,M.round);
  await speak(['n_'+M.a,add?'plus':'take','n_'+M.b,'equals','n_'+M.ans,praiseKey()]);
  if(!M||M.tok!==tok)return;
  if(M.round>=ROUNDS)roundWin(add?'Adding star!':'Take-away star!',()=>startMath(M?M.mode:'add'));
  else{await wait(500);nextMath();}
}
$('mSay').onclick=()=>{if(M)speak(['n_'+M.a,M.mode==='add'?'plus':'take','n_'+M.b,M.mode==='add'?'altogether':'left']);};

/* ---------- a for apple: see the letter, pick its picture ---------- */
let Ab=null;
const startWords=it=>it.words.filter(w=>!w.end);
function startAbc(){show('abc');Ab={round:0,order:shuffle(LETS)};onLeave=()=>{Ab=null;};nextAbc();}
function nextAbc(){
  if(!Ab)return;$('aDots').innerHTML=dotsHTML(ROUNDS,Ab.round);
  const it=Ab.order[Ab.round%Ab.order.length];Ab.it=it;const right=rnd(startWords(it));Ab.right=right;
  $('aLetter').innerHTML=`<div style="color:var(--coral);height:100%">${glyphSVG(it).replace('<svg','<svg style="height:100%"')}</div>`;
  $('aPrompt').textContent=`${it.id} is for …?`;
  const others=shuffle(LETS.filter(x=>x!==it)).slice(0,2).map(x=>rnd(startWords(x)));
  const opts=shuffle([right,...others]);
  $('aPicks').innerHTML=opts.map((o,i)=>`<button class="pick" data-i="${i}" aria-label="${o.word}">${wordPic(o)}<small>${o.word}</small></button>`).join('');
  speak('q_'+it.id);
  $('aPicks').querySelectorAll('.pick').forEach(b=>b.onclick=()=>{
    if(!Ab)return;const o=opts[+b.dataset.i];
    if(o===Ab.right){b.classList.add('right');sfx.stroke();Ab.round++;$('aDots').innerHTML=dotsHTML(ROUNDS,Ab.round);
      $('aPrompt').innerHTML=`${it.id} is for ${wordHTML(o.word,it.id)}!`;
      speak([o.key,S.phonics?'snd_'+it.id:null,praiseKey()]);
      if(Ab.round>=ROUNDS)setTimeout(()=>roundWin('Picture star!',startAbc),3000);else setTimeout(nextAbc,3200);}
    else{shakeEl(b);speak([o.key,'tryagain']);}
  });
}
$('aSay').onclick=()=>{if(Ab)speak('q_'+Ab.it.id);};

/* ---------- Pop the balloon ---------- */
let Pp=null;
function choosePop(){
  showOverlay(`<div class="big" style="font-size:44px">Pop what?</div>
    <div class="row"><button class="round" id="pN" style="width:84px;height:84px;color:var(--sky)" aria-label="Numbers">${numSVG(3)}</button>
    <button class="round" id="pL" style="width:84px;height:84px;color:var(--coral)" aria-label="Letters">${glyphSVG(LETS[0],'currentColor',11)}</button>
    <button class="round" id="pM" style="width:84px;height:84px" aria-label="Both">${pic('Balloon')}</button></div>
    <div class="row"><button class="textbtn" id="pX">Back</button></div>`);
  $('pN').onclick=()=>startPop(NUMS);$('pL').onclick=()=>startPop(LETS);$('pM').onclick=()=>startPop([...NUMS,...LETS]);$('pX').onclick=hideOverlay;
}
const BCOL=['#ff6b4a','#ffc23d','#2bb673','#3b8df0','#8a5cf0','#e0457b'];
function startPop(pool){
  show('pop');Pp={pool,round:0,balloons:[],raf:0,wrong:0};
  onLeave=()=>{cancelAnimationFrame(Pp.raf);$('sky').innerHTML='';Pp=null;};
  nextPop();Pp.raf=requestAnimationFrame(popTick);
}
const findKey=it=>it.world==='numbers'?'findn_'+it.id:'find_'+it.id;
const thatKey=it=>it.world==='numbers'?'thatn_'+it.id:'that_'+it.id;
function nextPop(){
  if(!Pp)return;$('pDots').innerHTML=dotsHTML(ROUNDS,Pp.round);Pp.wrong=0;
  const target=rnd(Pp.pool);Pp.target=target;
  const choices=shuffle([target,...shuffle(Pp.pool.filter(x=>x!==target)).slice(0,3)]);
  $('sky').innerHTML='';Pp.balloons=[];
  const w=$('sky').clientWidth,h=$('sky').clientHeight,slot=w/choices.length;
  choices.forEach((it,i)=>{
    const el=document.createElement('button');el.className='balloon';el.style.background=BCOL[(i+Pp.round)%BCOL.length];
    el.innerHTML=glyphSVG(it,'#fff',11);el.setAttribute('aria-label',it.say);
    const b={el,it,x:slot*i+slot/2-46,y:h*.45+Math.random()*h*.4,v:45+Math.random()*30,ph:Math.random()*6};
    el.style.transform=`translate(${b.x}px,${b.y}px)`;el.onclick=()=>hitBalloon(b);$('sky').appendChild(el);Pp.balloons.push(b);
  });
  $('pPrompt').textContent='Pop the '+(target.world==='numbers'?'number':'letter')+'!';
  speak(findKey(target));
}
function hitBalloon(b){
  if(!Pp||b.gone)return;
  if(b.it===Pp.target){b.gone=true;b.el.classList.add('pop');sfx.pop();Pp.round++;$('pDots').innerHTML=dotsHTML(ROUNDS,Pp.round);
    speak(praiseKey());if(Pp.round>=ROUNDS){const pool=Pp.pool;setTimeout(()=>roundWin('Pop star!',()=>startPop(pool)),700);}else setTimeout(nextPop,1300);}
  else{b.el.classList.remove('wrong');void b.el.offsetWidth;b.el.classList.add('wrong');sfx.boop();Pp.wrong++;
    speak([thatKey(b.it),findKey(Pp.target)]);
    if(Pp.wrong>=2)$('pPrompt').innerHTML=`Find <span style="display:inline-block;height:1.4em;vertical-align:middle">${glyphSVG(Pp.target).replace('<svg','<svg style="height:100%"')}</span>`;}
}
function popTick(t){
  if(!Pp)return;Pp.raf=requestAnimationFrame(popTick);const h=$('sky').clientHeight,dt=Math.min(.05,(t-(Pp.t||t))/1000);Pp.t=t;
  for(const b of Pp.balloons){if(b.gone)continue;b.y-=b.v*dt;if(b.y<-190)b.y=h+30;
    b.el.style.transform=`translate(${b.x+Math.sin(t/900+b.ph)*10}px,${b.y}px)`;}
}
$('pSay').onclick=()=>{if(Pp)speak(findKey(Pp.target));};

/* ---------- Sticker book ---------- */
function openStickers(){
  show('stickers');const tot=totalStars(),own=stickersOwned();
  $('sStars').innerHTML=pic('Star')+' '+tot;
  const need=3-(tot%3);
  $('sNext').textContent=own>=STICKERS.length?'Every sticker collected!':`${need} more star${need>1?'s':''} for a new sticker`;
  $('sMeter').style.width=(own>=STICKERS.length?100:((tot%3)/3*100))+'%';
  $('book').innerHTML=STICKERS.map((s,i)=>i<own?`<div class="slot">${pic(s,s)}</div>`:`<div class="slot locked">?</div>`).join('');
}

/* ---------- Grown-ups corner (press and hold the gear) ---------- */
let holdT=0;
$('gear').addEventListener('pointerdown',()=>{holdT=setTimeout(openParent,1200);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>$('gear').addEventListener(ev,()=>clearTimeout(holdT)));
$('gear').addEventListener('keydown',e=>{if(e.key==='Enter')openParent();});
function openParent(){
  showOverlay(`<div class="parent"><div class="big" style="font-size:32px">Grown-ups</div>
    <label for="pName">Child's name <input type="text" id="pName" maxlength="20" value="${escapeHTML(S.name)}" placeholder="e.g. Seun"></label>
    <label for="pVoice">Talking voice <input type="checkbox" id="pVoice" ${S.voice?'checked':''}></label>
    <label for="pPhon">Say letter sounds ("a says ah") <input type="checkbox" id="pPhon" ${S.phonics?'checked':''}></label>
    <label for="pReps">Rows to practise before the next one <select id="pReps">${[1,2,3].map(n=>`<option value="${n}" ${n===(S.reps||2)?'selected':''}>${n}</option>`).join('')}</select></label>
    <label for="pSound">Sound effects <input type="checkbox" id="pSound" ${S.sound?'checked':''}></label>
    <p class="sub" style="text-align:left;font-size:15px">Stars: ${totalStars()} · Stickers: ${stickersOwned()}/${STICKERS.length}. Progress is saved on this phone.${window.CLIPS?'':' The recorded voice is still loading; the phone\'s own voice is used until then.'}</p>
    <div class="row" style="flex-wrap:wrap"><button class="textbtn" id="pLines">Hear every voice line</button><button class="textbtn" id="pCred">Photo credits</button><button class="textbtn danger" id="pReset">Reset progress</button><button class="textbtn" id="pDone" style="background:var(--leaf);color:#fff">Done</button></div></div>`);
  const keep=()=>{S.name=$('pName').value.trim();S.voice=$('pVoice').checked;S.phonics=$('pPhon').checked;S.sound=$('pSound').checked;S.reps=+$('pReps').value;save();};
  $('pDone').onclick=()=>{keep();goHome();};
  $('pLines').onclick=()=>{keep();openPhraseList();};
  $('pCred').onclick=()=>{keep();openCredits();};
  $('pReset').onclick=()=>{if(confirm('Clear all stars and stickers on this phone?')){S.stars={};S.bonus=0;S.seen=0;save();goHome();}};
}
function openCredits(){
  const c=CONTENT.photoCredits||[];
  showOverlay(`<div class="big" style="font-size:28px">Photo credits</div><p class="sub" style="font-size:15px">Real photos are shared by their photographers under Creative Commons licences. Cartoon pictures: Microsoft Fluent Emoji (MIT). Voice: Microsoft neural voice Ezinne.</p>
    <div class="phrases">${c.map(x=>`<div style="padding:8px 10px;border-radius:12px;background:var(--road);font-size:14px;text-align:left"><b>${escapeHTML(x.word)}</b>: ${escapeHTML(x.text)}</div>`).join('')}</div>
    <div class="row"><button class="textbtn" id="crBack">Back</button></div>`);
  $('crBack').onclick=openParent;
}
function openPhraseList(){
  const keys=Object.keys(PHRASES);
  showOverlay(`<div class="big" style="font-size:28px">Voice lines</div><p class="sub" style="font-size:15px">Tap a line to hear it. Tell Claude the ones that sound wrong.</p>
    <div class="phrases">${keys.map(k=>`<button data-k="${k}">${pic('Play button')} <span>${escapeHTML(PHRASES[k])}</span></button>`).join('')}</div>
    <div class="row"><button class="textbtn" id="plBack">Back</button></div>`);
  $('ovCard').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>speak(b.dataset.k));
  $('plBack').onclick=openParent;
}

/* the recorded voice is big, so it loads after the game is on screen */
function loadVoice(){for(const f of ['photos.js','voice.js']){const s=document.createElement('script');s.src=f;s.async=true;document.body.appendChild(s);}}
goHome();
setTimeout(loadVoice,50);
/* installed app: keep working offline (skipped where the page can't register one) */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
